<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Subpar · Design System v3b</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #ece8e0; height: 100%; }
  body { font-family: 'Outfit', system-ui, sans-serif; }
  *::-webkit-scrollbar { width: 0; height: 0; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- Shared scaffolding -->
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>

<!-- Spec sections (new) -->
<script type="text/babel" src="spec-overview.jsx"></script>
<script type="text/babel" src="spec-typography.jsx"></script>
<script type="text/babel" src="spec-spacing.jsx"></script>
<script type="text/babel" src="spec-iconography.jsx"></script>
<script type="text/babel" src="spec-navigation.jsx"></script>

<!-- Color artboards (lifted) -->
<script type="text/babel" src="swatch-greens.jsx"></script>
<script type="text/babel" src="swatch-yellows.jsx"></script>
<script type="text/babel" src="color-y5-focus.jsx"></script>

<!-- Card artboards (lifted, finalized) -->
<script type="text/babel" src="card-drainit.jsx"></script>
<script type="text/babel" src="card-getlong-speed.jsx"></script>
<script type="text/babel" src="card-buildstrong.jsx"></script>
<script type="text/babel" src="components-getlong.jsx"></script>
<script type="text/babel" src="components-buildstrong.jsx"></script>

<!-- Phone screen (for context preview) -->
<script type="text/babel" src="screen-topo-v4.jsx"></script>

<script type="text/babel">
const PHONE_W = 390, PHONE_H = 844;

function Phone({ children }) {
  return (
    <IOSDevice width={PHONE_W} height={PHONE_H}>
      <div style={{ height: '100%', overflow: 'auto' }}>{children}</div>
    </IOSDevice>
  );
}

function App() {
  return (
    <DesignCanvas
      title="Subpar · Design System v3b"
      subtitle="Finalized choices from the v3 explorations · for designers extending the system">

      {/* 00 · OVERVIEW ---------------------------------------------------- */}
      <DCSection id="overview" title="00 · Overview"
        subtitle="What this system is, the canonical pairing, and an index of sections.">
        <DCArtboard id="overview-card" label="Overview · system at a glance"
          width={1040} height={920}>
          <SpecOverview/>
        </DCArtboard>
      </DCSection>

      {/* 01 · COLOR ------------------------------------------------------- */}
      <DCSection id="color" title="01 · Color"
        subtitle="The full green and yellow scales (G1–G10, Y1–Y10) plus the Y5 focus artboard documenting the single accent.">
        <DCArtboard id="greens" label="Greens · G1 → G10 · backgrounds + card preview"
          width={820} height={640}>
          <GreenSwatches/>
        </DCArtboard>
        <DCArtboard id="yellows" label="Yellows · Y1 → Y10 · accent palette · on-forest preview"
          width={820} height={680}>
          <YellowSwatches/>
        </DCArtboard>
        <DCArtboard id="y5-focus" label="Y5 · the only yellow · button family"
          width={900} height={1100}>
          <YellowFocusY5/>
        </DCArtboard>
      </DCSection>

      {/* 02 · TYPOGRAPHY -------------------------------------------------- */}
      <DCSection id="typography" title="02 · Typography"
        subtitle="Outfit + JetBrains Mono · 13-step scale, color rules, canonical example.">
        <DCArtboard id="type-spec" label="Type · families + scale + emphasis + in-context"
          width={1040} height={1820}>
          <SpecTypography/>
        </DCArtboard>
      </DCSection>

      {/* 03 · SPACING & RADIUS ------------------------------------------- */}
      <DCSection id="spacing" title="03 · Spacing, radius, elevation"
        subtitle="Card-size ladder (XS → XL), radius tokens, spacing scale, shadow tokens.">
        <DCArtboard id="spacing-spec" label="Spacing · card ladder · radii · spacing · shadows"
          width={1040} height={1900}>
          <SpecSpacing/>
        </DCArtboard>
      </DCSection>

      {/* 04 · ICONOGRAPHY ------------------------------------------------- */}
      <DCSection id="icons" title="04 · Iconography"
        subtitle="12 inline SVG icons (line + fill), color treatments, in-context examples.">
        <DCArtboard id="icons-spec" label="Icons · line + fill · sizes · contexts"
          width={1040} height={1700}>
          <SpecIconography/>
        </DCArtboard>
      </DCSection>

      {/* 05 · BUTTONS & PILLS -------------------------------------------- */}
      <DCSection id="buttons" title="05 · Buttons & pills"
        subtitle="Documented by the Y5 focus artboard above. This section is intentionally pinned here — buttons live with the accent color rules.">
        <DCArtboard id="buttons-note" label="See Section 01 · Y5 focus artboard"
          width={1040} height={220}>
          <ButtonsRef/>
        </DCArtboard>
      </DCSection>

      {/* 06 · NAVIGATION -------------------------------------------------- */}
      <DCSection id="nav" title="06 · Navigation"
        subtitle="The floating dark tab bar from Topo v4 — three states, anatomy, in-context preview.">
        <DCArtboard id="nav-spec" label="Nav · tab bar · states · anatomy · in-situ"
          width={1040} height={1240}>
          <SpecNavigation/>
        </DCArtboard>
        <DCArtboard id="topo-v4" label="Home screen · Topo v4 · canonical context"
          width={PHONE_W} height={PHONE_H}>
          <Phone><ScreenTopoV4/></Phone>
        </DCArtboard>
      </DCSection>

      {/* 07 · CARDS · DRAIN IT ------------------------------------------- */}
      <DCSection id="card-drainit" title="07 · Card · Drain It"
        subtitle="Putting accuracy challenge · 5 size variations (DI-XS → DI-XL). Forest card, citron accent, locked putting-green + flag decoration.">
        <DCArtboard id="drainit-sizes" label="Drain It · 5 size variations"
          width={540} height={1500}>
          <GetLongCardSizesV5/>
        </DCArtboard>
      </DCSection>

      {/* 08 · CARDS · GET LONG (SPEED) ----------------------------------- */}
      <DCSection id="card-getlong" title="08 · Card · Get Long (speed)"
        subtitle="Speed-training challenge · 5 size variations (GLS9-XS → GLS9-XL). Forest gradient card, ball-tracer SVG, citron MPH readout.">
        <DCArtboard id="getlong-sizes" label="Get Long · 5 size variations (v9)"
          width={540} height={1600}>
          <GetLongSpeedSizesV9/>
        </DCArtboard>
        <DCArtboard id="getlong-components" label="Get Long · background components · pixel-exact"
          width={840} height={2350}>
          <GetLongComponents/>
        </DCArtboard>
      </DCSection>

      {/* 09 · CARDS · BUILD STRONG --------------------------------------- */}
      <DCSection id="card-buildstrong" title="09 · Card · Build Strong"
        subtitle="Resistance + injury-prevention challenge · 5 size variations (BS6-XS → BS6-XL). Photo background, forest tint stack, citron CTA.">
        <DCArtboard id="buildstrong-sizes" label="Build Strong · 5 size variations (v6)"
          width={540} height={1600}>
          <BuildStrongV6/>
        </DCArtboard>
        <DCArtboard id="buildstrong-components" label="Build Strong · background components · pixel-exact"
          width={900} height={2400}>
          <BuildStrongV6Backgrounds/>
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

// Small note artboard explaining the buttons section is in Color.
function ButtonsRef() {
  const ink = '#10241a';
  const sub = '#6b756f';
  const paper = '#f7f4ea';
  const rule = '#e2dcc0';
  const citron = '#cfde50';
  const forest = '#1d4e34';
  return (
    <div style={{ width: '100%', height: '100%', background: paper, color: ink,
      fontFamily: '"Outfit", system-ui, sans-serif',
      padding: '32px 36px', boxSizing: 'border-box',
      display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 24,
      border: `1px solid ${rule}`, borderRadius: 0 }}>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 10.5, fontWeight: 800, letterSpacing: '0.22em',
          textTransform: 'uppercase', color: sub }}>
          Section 05 · buttons & pills
        </div>
        <div style={{ marginTop: 8, fontSize: 28, fontWeight: 800,
          letterSpacing: '-0.025em', lineHeight: 1.05, maxWidth: 720 }}>
          Buttons live with the accent.
          <span style={{ color: sub, fontWeight: 500 }}> See <em>01 · Color · Y5 focus</em> for the full button family.</span>
        </div>
        <div style={{ marginTop: 8, fontSize: 13, color: sub, fontWeight: 500, maxWidth: 720 }}>
          The button system is defined by the single accent (Y5 citron). Solid, solid-glow, pill, outline, ghost, segmented, icon, FAB — all use the same hex with different elevation and chroma treatment.
        </div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, alignItems: 'flex-end' }}>
        <button style={{ padding: '12px 18px', borderRadius: 14, border: 'none',
          background: citron, color: forest, fontWeight: 800, fontSize: 14,
          fontFamily: '"Outfit", system-ui, sans-serif',
          letterSpacing: '-0.01em', cursor: 'pointer',
          boxShadow: '0 6px 14px rgba(207,222,80,0.28)' }}>
          Start session →
        </button>
        <button style={{ padding: '10px 16px', borderRadius: 99, border: 'none',
          background: citron, color: forest, fontWeight: 800, fontSize: 13,
          fontFamily: '"Outfit", system-ui, sans-serif', cursor: 'pointer' }}>
          Today
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
